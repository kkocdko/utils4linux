[[skills.config]]
path = "/media/kkocdko/KK_TMP_1/home/.codex/skills/context7-mcp/SKILL.md"
enabled = false
[[skills.config]]
path = "/media/kkocdko/KK_TMP_1/home/.codex/skills/simple-english/SKILL.md" # curl -L https://github.com/AminBlg/SimpleEnglish/archive/refs/tags/v2.0.2.tar.gz | tar -xz ; mv SimpleEnglish-*/skills/simple-english ~/.codex/skills/ ; rm -rf SimpleEnglish-*
